{% extends "base.html" %}
{% load static %}

{% block title %}Log Out{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="mb-4">Log Out</h1>
      
      <p>Are you sure you want to log out?</p>
      
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Log Out</button>
        <a href="{% url 'pages:home' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
