{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Set Password{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="mb-4">Set Password</h1>
      
      <p>Please set a password for your account.</p>
      
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        
        <button type="submit" class="btn btn-primary">Set Password</button>
        <a href="{% url 'pages:home' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
